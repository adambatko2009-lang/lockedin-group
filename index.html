<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LockedIn Group</title>
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LockedIn">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* Layout: content cards scroll under floating glass bars (date bar on top, tab bar at the bottom on phones).
     Glass is only on those bars, never on content. Monitors get a two-column dashboard and no tab bar.
     Style: "graphite" (charcoal, cool grays, chrome numbers), blue for actions, traffic-light status colors.
     A faint dot grid + soft blue glows sit behind everything so the frosted glass bars read clearly.
     Dark is the default look; light is its mirror. Every text color meets 4.5:1 on its background in both themes. */
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --surface-2: #ececf1; --line: rgba(10, 10, 11, 0.08); --line-strong: rgba(10, 10, 11, 0.16);
    --card: #ffffff; --card-hi: rgba(255, 255, 255, 0);
    --chrome: linear-gradient(180deg, #2a2a31 0%, #0a0a0b 45%, #55555f 72%, #1c1c21 100%);
    --text: #0a0a0b; --text-2: #3a3a42; --muted: #62626d;
    --acc: #2563eb; --acc-lt: #1d4ed8; --acc-dk: #60a5fa;   /* the group's color (Admin → Group settings) */
    --accent: var(--acc); --accent-text: var(--acc-lt); --on-accent: #ffffff;
    --good: #28c840; --warn: #febc2e; --crit: #ff5f57; --on-good: #0a0a0b; --on-warn: #0a0a0b; --on-crit: #0a0a0b;
    --discord: #5865f2;
    --glass: rgba(255, 255, 255, 0.6); --glass-edge: rgba(10, 10, 11, 0.10); --glass-shade: rgba(0, 0, 0, 0.08);
    --glass-pill: rgba(10, 10, 11, 0.07); --glass-hi: rgba(255, 255, 255, 0.8);
    --glow-1: color-mix(in srgb, var(--acc) 10%, transparent); --glow-2: color-mix(in srgb, var(--acc-dk) 8%, transparent); --dots: rgba(10, 10, 11, 0.06);
    --font-ui: "Geist", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    --font-data: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  /* Dark colors: when the device is dark (unless you picked Light in Settings), or when you picked Dark. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181c; --surface: #222329; --surface-2: #2b2c33; --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.16);
      --card: linear-gradient(180deg, #25262c 0%, #1e1f24 100%); --card-hi: rgba(255, 255, 255, 0.06);
      --chrome: linear-gradient(180deg, #ffffff 0%, #ececf1 34%, #9d9da8 58%, #e6e6ec 82%, #c4c4cc 100%);
      --text: #f5f5f7; --text-2: #c9c9d1; --muted: #9a9aa6;
      --accent: var(--acc); --accent-text: var(--acc-dk); --on-accent: #ffffff;
      --good: #28c840; --warn: #febc2e; --crit: #ff5f57; --on-good: #0a0a0b; --on-warn: #0a0a0b; --on-crit: #0a0a0b;
      --glass: rgba(255, 255, 255, 0.08); --glass-edge: rgba(255, 255, 255, 0.18); --glass-shade: rgba(0, 0, 0, 0.35);
      --glass-pill: rgba(255, 255, 255, 0.14); --glass-hi: rgba(255, 255, 255, 0.14);
      --glow-1: color-mix(in srgb, var(--acc) 22%, transparent); --glow-2: color-mix(in srgb, var(--acc-dk) 12%, transparent); --dots: rgba(255, 255, 255, 0.05);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #17181c; --surface: #222329; --surface-2: #2b2c33; --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.16);
      --card: linear-gradient(180deg, #25262c 0%, #1e1f24 100%); --card-hi: rgba(255, 255, 255, 0.06);
      --chrome: linear-gradient(180deg, #ffffff 0%, #ececf1 34%, #9d9da8 58%, #e6e6ec 82%, #c4c4cc 100%);
      --text: #f5f5f7; --text-2: #c9c9d1; --muted: #9a9aa6;
      --accent: var(--acc); --accent-text: var(--acc-dk); --on-accent: #ffffff;
      --good: #28c840; --warn: #febc2e; --crit: #ff5f57; --on-good: #0a0a0b; --on-warn: #0a0a0b; --on-crit: #0a0a0b;
      --glass: rgba(255, 255, 255, 0.08); --glass-edge: rgba(255, 255, 255, 0.18); --glass-shade: rgba(0, 0, 0, 0.35);
      --glass-pill: rgba(255, 255, 255, 0.14); --glass-hi: rgba(255, 255, 255, 0.14);
      --glow-1: color-mix(in srgb, var(--acc) 22%, transparent); --glow-2: color-mix(in srgb, var(--acc-dk) 12%, transparent); --dots: rgba(255, 255, 255, 0.05);
      color-scheme: dark;
  }
  /* Group colors. Each passes 4.5:1: white on the button color, and the text color on light and dark backgrounds. */
  :root[data-accent="violet"], .acc-violet { --acc: #7c3aed; --acc-lt: #6d28d9; --acc-dk: #a78bfa; }
  :root[data-accent="green"],  .acc-green  { --acc: #15803d; --acc-lt: #15803d; --acc-dk: #4ade80; }
  :root[data-accent="orange"], .acc-orange { --acc: #c2410c; --acc-lt: #c2410c; --acc-dk: #fb923c; }
  :root[data-accent="red"],    .acc-red    { --acc: #dc2626; --acc-lt: #b91c1c; --acc-dk: #f87171; }
  :root[data-accent="teal"],   .acc-teal   { --acc: #0f766e; --acc-lt: #0f766e; --acc-dk: #2dd4bf; }
  :root[data-accent="pink"],   .acc-pink   { --acc: #be185d; --acc-lt: #be185d; --acc-dk: #f472b6; }
  :root[data-accent="gold"],   .acc-gold   { --acc: #a16207; --acc-lt: #a16207; --acc-dk: #facc15; }
  .acc-blue { --acc: #2563eb; --acc-lt: #1d4ed8; --acc-dk: #60a5fa; }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0; min-height: 100%; color: var(--text); font: 16px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased;
    background: var(--bg);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  }
  /* Calm backdrop so the glass bars have something to blur: two soft blue glows + a faint dot grid. Stays still while you scroll. */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(42% 36% at 12% 8%, var(--glow-1), transparent 70%),
      radial-gradient(38% 32% at 92% 88%, var(--glow-2), transparent 70%),
      radial-gradient(var(--dots) 1px, transparent 1.4px) 0 0 / 22px 22px;
  }
  main { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  /* Same 12px gap between every card on a page (16px on monitors). */
  #app { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

  /* ---------- glass: navigation layer only ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 30px var(--glass-shade);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--surface); } }
  @media (prefers-reduced-transparency: reduce) { .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  @media (prefers-contrast: more) { .glass { background: var(--surface); border-color: var(--text-2); } }

  .topbar {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5;
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 4px;
    border-radius: 999px; padding: 4px;
  }
  .topbar .mid { text-align: center; min-width: 0; line-height: 1.15; }
  .topbar .mid b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .mid button { border: 0; background: none; color: var(--accent-text); font-size: 13px; font-weight: 600; padding: 2px 8px; min-height: 22px; cursor: pointer; }
  .topbar .mid small { display: block; font-size: 12px; color: var(--muted); }
  .topbar small.err, .topbar .err { color: var(--crit); }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; font-size: 22px; cursor: pointer; display: grid; place-items: center; }
  .round:not(:disabled):active { background: var(--glass-pill); transform: scale(0.92); }
  .round:disabled { opacity: 0.3; cursor: default; }

  .tabbar {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: min(420px, calc(100% - 32px));
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 5px; border-radius: 999px;
  }
  .tabbar .pill { position: absolute; top: 5px; bottom: 5px; left: 5px; border-radius: 999px; background: var(--glass-pill); }
  .tabbar button { position: relative; min-height: 50px; border: 0; background: transparent; border-radius: 999px; cursor: pointer;
                   display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--text-2); }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button span { font-size: 11px; font-weight: 600; }
  .tabbar button[aria-selected="true"] { color: var(--accent-text); }
  .tabbar button:active { transform: scale(0.94); }
  .tabbar .badge { position: absolute; top: 6px; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
                   background: var(--crit); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- content (solid, no glass) ---------- */
  .card { background: var(--card); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--card-hi); border-radius: 16px; padding: 16px; min-width: 0; }
  .msg { font-size: 14px; color: var(--text-2); margin: 0; }
  .msg.err { color: var(--crit); }

  .track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); }
  .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--muted); opacity: 0.6; }
  .track .now { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 3px var(--surface); }
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; gap: 10px; }
  .meta .count { font: 600 30px var(--font-data); letter-spacing: -0.03em; }
  .meta .count, .pts, .tile b { background: var(--chrome); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .meta .count span { -webkit-text-fill-color: var(--muted); }
  .meta .count span { font-size: 17px; color: var(--muted); font-weight: 500; }
  .meta .time { font: 600 14px var(--font-data); color: var(--text-2); text-align: right; }
  .stack { display: flex; gap: 2px; height: 6px; margin-top: 12px; }
  .stack i { border-radius: 3px; min-width: 6px; }

  .dot { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .COMPLETE { background: var(--good); color: var(--on-good); }
  .PARTIAL { background: var(--warn); color: var(--on-warn); }
  .MISSING { background: var(--crit); color: var(--on-crit); }
  .WAITING, .UNLOGGED { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--muted); }
  .EXCUSED { background: var(--surface-2); color: var(--text-2); box-shadow: inset 0 0 0 1.5px var(--line); }

  .member { padding: 14px 0; border-top: 1px solid var(--line); }
  .member:first-child { border-top: 0; padding-top: 0; }
  .member:last-child { padding-bottom: 0; }
  .mrow { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .name { flex: 1; font-size: 17px; font-weight: 600; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .name .namebtn { flex: 0 1 auto; min-width: 4ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .you { font-size: 11px; font-weight: 700; color: var(--accent-text); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
  .icon { width: 44px; height: 44px; margin: -8px 0; border: 0; background: transparent; border-radius: 50%; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .icon svg { width: 19px; height: 19px; }
  .icon.has { color: var(--accent-text); }
  .icon:active { background: var(--surface-2); }
  .toggles { display: grid; grid-template-columns: var(--pcols, repeat(4, 1fr)); gap: 6px; }
  .toggles .t.req + .t.bonus { margin-left: 6px; }
  .t { min-height: 48px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; color: var(--text-2);
       font-size: 13px; font-weight: 600; line-height: 1.15; padding: 6px 4px; cursor: pointer; text-align: center; }
  .t.bonus { border-style: dashed; }
  .t[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .t[aria-pressed="true"]::before { content: "✓ "; font-weight: 700; }
  .t:not(:disabled):active { transform: scale(0.96); filter: brightness(0.92); }
  .t:disabled { cursor: default; }
  .member.locked .t:not([aria-pressed="true"]) { opacity: 0.5; }
  .note { margin-top: 8px; }
  .note p { margin: 0; font-size: 14px; color: var(--text-2); overflow-wrap: anywhere; white-space: pre-wrap;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden; cursor: pointer; }
  .note p.open { display: block; -webkit-line-clamp: unset; line-clamp: none; cursor: default; }
  .note input { width: 100%; min-height: 42px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
                color: var(--text); font: 15px var(--font-ui); padding: 8px 12px; }
  .note input::placeholder { color: var(--muted); }
  .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .shot { width: 64px; height: 64px; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2) center / cover no-repeat; cursor: zoom-in; }
  .shot.busy { cursor: default; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
  .shot:active { transform: scale(0.96); }

  /* edit panel: a sheet from the bottom on phones, a drawer from the right on monitors */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.45); }
  .panel { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto;
           background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
           box-shadow: 0 -12px 40px var(--glass-shade);
           padding: 8px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
  .panel .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
  .panel header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .panel header b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .panel header span { font-size: 14px; color: var(--muted); }
  .panel h3 { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin: 18px 0 8px; }
  .panel textarea { width: 100%; min-height: 140px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
                    color: var(--text); font: 16px/1.4 var(--font-ui); padding: 10px 12px; }
  .panel textarea::placeholder { color: var(--muted); }
  .panel .count-hint { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
  .pics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pic { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
  .pic > button.open { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: center / cover no-repeat; cursor: zoom-in; }
  .pic > button.remove { position: absolute; top: 6px; right: 6px; min-width: 32px; height: 32px; padding: 0 10px; border-radius: 16px; border: 0;
                         background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .pic.busy { display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .addpic { aspect-ratio: 4 / 3; border-radius: 12px; border: 1.5px dashed var(--muted); background: transparent; color: var(--accent-text);
            font-size: 15px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .addpic svg { width: 26px; height: 26px; }
  .addpic:active { transform: scale(0.98); }
  .panel .done { width: 100%; margin-top: 20px; justify-content: center; }
  .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); cursor: pointer; }
  .switchrow b { display: block; font-size: 16px; font-weight: 600; }
  .switchrow small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .switchrow input { appearance: none; -webkit-appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line); position: relative; cursor: pointer; transition: background-color .2s; }
  .switchrow input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
  .switchrow input:checked { background: var(--good); }
  .switchrow input:checked::after { transform: translateX(20px); }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: sheet-up .28s cubic-bezier(.2, .9, .3, 1); }
    @keyframes sheet-up { from { transform: translateY(100%); } }
  }
  @media (min-width: 960px) {
    .panel { left: auto; top: 12px; bottom: 12px; right: 12px; width: 440px; max-height: none; border-radius: 20px; border: 1px solid var(--line);
             box-shadow: 0 20px 60px var(--glass-shade); padding: 20px 22px; }
    .panel .grab { display: none; }
    .pics { grid-template-columns: repeat(2, 1fr); }
    @media (prefers-reduced-motion: no-preference) {
      .panel { animation: drawer-in .28s cubic-bezier(.2, .9, .3, 1); }
      @keyframes drawer-in { from { transform: translateX(calc(100% + 24px)); } }
    }
  }

  /* full-size screenshot viewer */
  /* full-screen picture viewer: swipe or arrows between pictures, pinch / double-tap / wheel to zoom */
  dialog#viewer { border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none;
                  background: rgba(0, 0, 0, 0.94); color: #fff; overflow: hidden; }
  dialog#viewer::backdrop { background: rgba(0, 0, 0, 0.94); }
  dialog#viewer[open] { display: flex; flex-direction: column; }
  .vtop { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px 18px; }
  .vtop .vcap { flex: 1; min-width: 0; font-size: 14px; color: #d4d4dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vtop .vcap b { color: #fff; font-weight: 600; }
  .vtop .vn { font: 600 13px var(--font-data); color: #a8a8b3; }
  .vtop .round { color: #fff; background: rgba(255, 255, 255, 0.12); width: 40px; height: 40px; font-size: 18px; }
  .vstage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .vstage img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: 0 0; will-change: transform; -webkit-user-drag: none; cursor: zoom-in; }
  .vstage.zoomed img { cursor: grab; }
  .vnav { position: absolute; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.14);
          color: #fff; font-size: 26px; cursor: pointer; display: grid; place-items: center; z-index: 2; }
  .vnav.prev { left: 14px; } .vnav.next { right: 14px; }
  .vnav:hover { background: rgba(255, 255, 255, 0.24); }
  @media (hover: none) { .vnav { display: none; } }

  .grid-wrap { overflow-x: auto; }

  /* moving smoke: soft colored clouds, blurred together, with film grain on top */

  .smoke i:nth-child(3) { width: 60vmax; height: 30vmax; left: 15%; bottom: -10%; background: radial-gradient(closest-side, rgba(230, 236, 255, 0.24), transparent); animation: drift-c 24s ease-in-out infinite alternate; }

  .smoke::after { content: ""; position: absolute; inset: 0; z-index: 3; background: radial-gradient(120% 90% at 50% 45%, transparent 35%, #000 85%); }
  .lp-hero .smoke { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }

// ---------------------------------------------------------------- dates (New York trading days)
let HOLIDAYS = new Set();
const parse = k => new Date(k + "T12:00:00Z");
const keyOf = d => d.toISOString().slice(0, 10);
const addDays = (k, n) => { const d = parse(k); d.setUTCDate(d.getUTCDate() + n); return keyOf(d); };
const isTradingDay = k => { const w = parse(k).getUTCDay(); return w > 0 && w < 6 && !HOLIDAYS.has(k); };
const prevTrading = k => { do k = addDays(k, -1); while (!isTradingDay(k)); return k; };
const nextTrading = k => { do k = addDays(k, 1); while (!isTradingDay(k)); return k; };
const mondayOf = k => addDays(k, -((parse(k).getUTCDay() + 6) % 7));
const fmtDay = (k, o) => parse(k).toLocaleDateString("en-GB", Object.assign({ weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }, o));

function nyParts(ms) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    .formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return { key: `${p.year}-${p.month}-${p.day}`, hour: +p.hour, minute: +p.minute };
}
// The real moment of HH:00 New York time on a given date (handles daylight saving).
function nyMoment(k, hour) {
  const guess = Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10), hour);
  const p = nyParts(guess);
  const seen = Date.UTC(+p.key.slice(0, 4), +p.key.slice(5, 7) - 1, +p.key.slice(8, 10), p.hour, p.minute);
  return new Date(guess - (seen - guess));
}
function currentTradingDay() {
  const p = nyParts(Date.now());
  let k = p.key;
  if (p.hour < CUTOFF_HOUR) k = addDays(k, -1);
  while (!isTradingDay(k)) k = addDays(k, -1);
  return k;
}
const opensAt = k => nyMoment(k, CUTOFF_HOUR);
const closesAt = k => nyMoment(nextTrading(k), CUTOFF_HOUR);
const isFinal = k => Date.now() >= closesAt(k).getTime();

const group = () => groups.find(g => g.id === gid) || null;

const myKey = () => { const m = myMembership(); return m && m.status === "approved" ? m.member_key : null; };

  if (!g) return false;

}

  : (myMembership(g.id) || {}).role === "admin" ? "Admin" : (myMembership(g.id) || {}).status === "approved" ? "Member" : isAppOwner ? "App owner" : "";

function statusOf(k, key) {
  const rec = tickOf(k, key);
  if (rec && rec.excused) return "EXCUSED";   // set by the admin: sick, travelling...
  const req = rec ? REQUIRED.filter(r => rec[r]).length : 0;
  if (req === REQUIRED.length) return "COMPLETE";
  if (req > 0) return "PARTIAL";
  if (!isFinal(k)) return "WAITING";       // the day is still open, nothing yet isn't a fail
  if (!dayHasAny(k)) return "UNLOGGED";      // nobody logged anything that day: don't count it
  return "MISSING";
}

// Load one group's names, ticks and reflections, and switch the app to it.
async function openGroup(id) {
  const changed = id !== gid || !loaded;
  gid = id;
  try { localStorage.setItem("group", id); } catch (e) {}
  const g = group();
  applyGroupRules(g);
  isAdmin = canManageGroup(g);
  loadStep = "members and ticks";
  const [m, h, t] = await Promise.all([
    sb.from("members").select("*").eq("group_id", id),
    sb.from("holidays").select("day"),
    sb.from("ticks").select("*").eq("group_id", id).order("day", { ascending: false }).limit(5000),
  ]);
  const failed = [m, h, t].find(r => r.error);
  if (failed) { error = "Couldn't load data: " + failed.error.message; }
  members = m.data || [];
  HOLIDAYS = new Set((h.data || []).map(r => r.day));
  ticks = {};
  (t.data || []).forEach(r => { ticks[r.day + "|" + r.member_key] = r; });
  applyOutbox();
  today = currentTradingDay();
  if (changed || selected > today || !isTradingDay(selected)) selected = today;
  weekStart = mondayOf(selected);
  loadStep = "weekly reflections";
  const rf = await sb.from("reflections").select("*").eq("group_id", id).order("week_start", { ascending: false }).limit(3000);
  reflections = {};
  if (!rf.error) (rf.data || []).forEach(r => { reflections[r.week_start + "|" + r.member_key] = r; });
  loadStep = "admin list";
  people = [];
  if (isAdmin) await loadPeople();
  if (isAppOwner) await loadOwnerData();
  loadStep = "done";
  if (changed) profileKey = null;
  if (!isAdmin && tab === "admin") tab = "day";
  loaded = true; screen = "app";
  offlineSince = null;
  subscribe();
  render();
  if (!failed) saveSnapshot();
  flushOutbox();
  maybeStartTour();
}

function subscribe() {
  if (channel) { sb.removeChannel(channel); channel = null; }
  const filter = `group_id=eq.${gid}`, here = gid;
  channel = sb.channel("group-" + gid)
    .on("postgres_changes", { event: "*", schema: "public", table: "ticks", filter }, payload => {
      const row = payload.new && payload.new.day ? payload.new : payload.old;
      if (!row || !row.day || here !== gid || (row.group_id && row.group_id !== gid)) return;
      const id = row.day + "|" + row.member_key;
      if (payload.eventType === "DELETE") delete ticks[id];
      else if (!pending[id]) ticks[id] = payload.new;   // don't overwrite a tick you're still saving
      render();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "reflections", filter }, payload => {
      const row = payload.new && payload.new.week_start ? payload.new : payload.old;
      if (!row || !row.week_start || here !== gid || (row.group_id && row.group_id !== gid)) return;
      const id = row.week_start + "|" + row.member_key;
      if (payload.eventType === "DELETE") delete reflections[id];
      else if (!pendingRefl[id]) reflections[id] = payload.new;
      render();

    .on("postgres_changes", { event: "*", schema: "public", table: "memberships", filter }, () => {

      if (isAdmin && here === gid) loadPeople().then(render);

    .subscribe();
}

// One save at a time per row; quick taps are combined into one save.
const pending = {}, timers = {};
function editTick(k, key, mutate, quiet) {
  if (!canEdit(k, key)) return;

  const row = Object.assign({ day: k, member_key: key, chart: false, journal: false, review: false, social: false, box5: false, box6: false, note: "", images: [], no_trade: false, rule_breaks: [] }, tickOf(k, key));
  row.images = [...(row.images || [])];
  row.rule_breaks = [...(row.rule_breaks || [])];
  const before = statusOf(k, key);

  const c = document.createElement("canvas"), dpr = window.devicePixelRatio || 1;

  const colors = ["--good", "--warn", "--accent-text", "--crit"].map(v => css.getPropertyValue(v).trim()).concat("#ffffff");
  const bits = Array.from({ length: 150 }, () => ({

    w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)],
  }));

// ---------------------------------------------------------------- screenshots
// Stored privately in Supabase Storage as <day>/<member>/<time>.jpg; shown through short-lived signed links.
const MAX_SHOTS = 4;
const shotUrls = {}, shotRequested = new Set(), uploading = {};
let shotTarget = null, viewing = null;

function ensureShotUrls(paths) {
  const missing = paths.filter(p => !shotUrls[p] && !shotRequested.has(p));
  if (!missing.length) return;
  missing.forEach(p => shotRequested.add(p));
  sb.storage.from("screenshots").createSignedUrls(missing, 3600).then(({ data }) => {
    (data || []).forEach(d => { if (d.signedUrl) shotUrls[d.path] = d.signedUrl; });
    render();
  });
}
// Signed links last an hour; refresh them before they run out.
setInterval(() => { Object.keys(shotUrls).forEach(p => delete shotUrls[p]); shotRequested.clear(); if (screen === "app") render(); }, 50 * 60000);

// Shrink to max 1600px and JPEG, so a screenshot is ~200-300 KB instead of several MB.
async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error("couldn't read this image (try a PNG or JPG)"));
      img.src = src;
    });
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.82));
    if (!blob) throw new Error("couldn't read this image");
    return blob;
  } finally { URL.revokeObjectURL(src); }
}

async function uploadShot(day, key, file) {
  if (!canEdit(day, key) || !file) return;
  if (((tickOf(day, key) || {}).images || []).length + (uploading[key] || 0) >= MAX_SHOTS) { error = `Max ${MAX_SHOTS} screenshots per day.`; return render(); }
  if (file.type && !file.type.startsWith("image/")) { error = "That file isn't a picture."; return render(); }
  uploading[key] = (uploading[key] || 0) + 1; render();
  try {
    const blob = await shrink(file);
    const path = `${day}/${key}/${Date.now()}.jpg`;
    const { error: e } = await sb.storage.from("screenshots").upload(path, blob, { contentType: "image/jpeg", upsert: false });
    if (e) throw e;
    shotUrls[path] = URL.createObjectURL(blob);
    error = "";
    editTick(day, key, row => { row.images = [...row.images, path]; });
  } catch (e) {
    error = "Screenshot not saved: " + (/row-level security|unauthorized|403/i.test(e.message || "") ? "this day is closed or the row isn't yours." : (e.message || e));
  } finally {
    uploading[key]--; render();
  }
}

    }
    if (s0.moved || e.type === "pointercancel") return;
    // A tap: double-tap (or a click with a mouse) zooms in / out; a tap beside the picture closes.
    const r = document.getElementById("viewer-img").getBoundingClientRect(), now = Date.now();
    const onImg = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (e.pointerType === "mouse") { if (onImg) zoomAt(V.s > 1 ? 1 : 2.5, e.clientX, e.clientY); else document.getElementById("viewer").close(); return; }
    if (now - lastTap < 300) { lastTap = 0; zoomAt(V.s > 1 ? 1 : 2.5, e.clientX, e.clientY); return; }
    lastTap = now;
    if (!onImg && V.s === 1) setTimeout(() => { if (lastTap === now) document.getElementById("viewer").close(); }, 300);
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
  stage.addEventListener("wheel", e => { e.preventDefault(); zoomAt(V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); }, { passive: false });
  document.getElementById("viewer").addEventListener("close", () => { viewing = null; setZoom(1, 0, 0); });
  document.addEventListener("keydown", e => {
    if (!document.getElementById("viewer").open) return;
    if (e.key === "ArrowRight") stepViewer(1);
    if (e.key === "ArrowLeft") stepViewer(-1);
  });
})();

// Square, 256px, JPEG: small and quick for everyone.
async function uploadLogo(file) {
  if (!file || !isGroupOwner()) return;
  try {
    const src = URL.createObjectURL(file), img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("couldn't read this image")); img.src = src; });
    const c = document.createElement("canvas"), side = Math.min(img.naturalWidth, img.naturalHeight);
    c.width = c.height = 256;
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
    URL.revokeObjectURL(src);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
    const path = `${gid}/${Date.now()}.jpg`, old = group().logo_path;
    const { error: e } = await sb.storage.from("logos").upload(path, blob, { contentType: "image/jpeg", upsert: false });
    if (e) throw e;
    await adminDo(sb.from("groups").update({ logo_path: path }).eq("id", gid), "Logo updated.");
    if (old) sb.storage.from("logos").remove([old]);
  } catch (e) { error = "Logo not saved: " + (e.message || e); render(); }
}

// ---------------------------------------------------------------- rendering helpers
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Text with clickable links (only http/https). Shows a short "instagram.com/p/…" label; the full address is on hover.
function linkify(text) {
  return esc(text).replace(/https?:\/\/[^\s<]+/g, raw => {
    const trail = raw.match(/[.,;:!?)\]]+$/), url = trail ? raw.slice(0, -trail[0].length) : raw;
    let label = url.replace(/^https?:\/\/(www\.)?/, "");
    if (label.length > 34) label = label.slice(0, 32) + "…";
    return `<a href="${url}" target="_blank" rel="noopener noreferrer nofollow" title="${url}">${label}</a>${trail ? trail[0] : ""}`;
  });
}

  else { mins = Math.max(0, Math.round((close - now) / 60000)); time = `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, "0")}m left`; }

  ensureShotUrls(allShots);

  const summary = `<div class="card">

function stats(key) {
  const days = [...new Set(Object.keys(ticks).map(id => id.split("|")[0]))].filter(isTradingDay).sort();
  let points = 0, run = 0, best = 0, closed = 0, complete = 0, last = null;
  let noTrades = 0, completeDays = 0, social = 0, notes = 0, pics = 0, comebacks = 0, prevSt = null, since = null;
  const weeks = {};   // monday -> {n: closed days counted, ex: excused days, ok: all Complete, open: has an open day}
  for (const k of days) {
    if (last && nextTrading(last) !== k) run = 0;   // an unlogged trading day in between breaks a streak
    last = k;
    const raw = tickOf(k, key), rec = raw || {}, st = statusOf(k, key);
    const w = weeks[mondayOf(k)] = weeks[mondayOf(k)] || { n: 0, ex: 0, ok: true, open: false };
    if (rec.note) notes++;
    pics += (rec.images || []).length;
    if (st === "EXCUSED") { w.ex++; continue; }   // no points, no streak change, not counted in %
    if (raw && !since) since = k;
    const bonusTicks = RULES.filter(r => r[2] === "bonus" && rec[r[0]]).length;   // the group's bonus boxes
    social += bonusTicks;
    points += (POINTS[st] || 0) + POINTS.bonus * bonusTicks;
    if (st === "COMPLETE") { run++; best = Math.max(best, run); completeDays++; if (prevSt === "MISSING") comebacks++; if (rec.no_trade) noTrades++; }
    else if (isFinal(k)) run = 0;
    if (isFinal(k)) { closed++; if (st === "COMPLETE") complete++; prevSt = st; w.n++; if (st !== "COMPLETE") w.ok = false; }
    else w.open = true;
  }
  if (last && last !== today && nextTrading(last) < today) run = 0;
  // A perfect week: every trading day Mon-Fri closed and Complete (excused days are skipped).
  const perfectWeeks = Object.entries(weeks).filter(([mon, w]) =>
    w.ok && !w.open && w.n > 0 && w.n + w.ex === [0, 1, 2, 3, 4].filter(i => isTradingDay(addDays(mon, i))).length).length;
  return { points, run, best, rate: closed ? Math.round(100 * complete / closed) : null,
           completeDays, social, notes, pics, comebacks, perfectWeeks, noTrades, since };
}

  { id: "complete", icon: "check", unit: "complete days",     metric: s => s.completeDays, goals: [10, 25, 50, 100, 250] },

function rankOf(key) {
  const rows = activeMembers().map(m => ({ key: m.key, name: m.name, ...stats(m.key) }))
    .sort((a, b) => b.points - a.points || b.run - a.run || a.name.localeCompare(b.name));
  let rank = 0, prev = null;
  for (let i = 0; i < rows.length; i++) {
    if (!prev || rows[i].points !== prev.points || rows[i].run !== prev.run) rank = i + 1;
    prev = rows[i];
    if (rows[i].key === key) return rank;
  }
  return null;
}

// Pop up "Achievement unlocked" when you earn a new badge (remembered per browser).
let toastTimer = null;
function checkUnlocks() {
  if (!myKey() || !loaded || !session) return;
  const earned = badgesFor(stats(myKey())).filter(b => b.earned);
  const storeKey = "badges:" + session.user.id;
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(storeKey) || "null"); } catch (e) { return; }
  const ids = earned.map(b => b.id);
  try { localStorage.setItem(storeKey, JSON.stringify(ids)); } catch (e) {}
  if (!seen) return;   // first visit: just remember what you already have
  const fresh = earned.filter(b => !seen.includes(b.id));
  if (!fresh.length) return;
  const b = fresh[fresh.length - 1], t = document.getElementById("toast");
  t.innerHTML = `<div class="medal tier-${b.tier}"><span>${ic(b.icon, 26)}</span></div><div><b>Achievement unlocked!</b><span>${esc(b.title)}${fresh.length > 1 ? ` · +${fresh.length - 1} more` : ""}</span></div>`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}

    + `Streak = Complete days in a row. Excused (E) days don't count. You can tick your own boxes until ${hh(CUTOFF_HOUR)} ${esc(tzCity(TZ))} time on the next trading day.`;

// Fade sections in as they scroll into view (everything shows at once if motion is reduced).
function revealLanding() {
  const els = document.querySelectorAll(".lp .rv:not(.in), .lp .stage:not(.in)");
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) { els.forEach(el => el.classList.add("in")); return; }
  const io = new IntersectionObserver(list => list.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: 0.18 });
  els.forEach(el => io.observe(el));
}

function setTab(t) {
  if (t === tab && !profileKey) { selected = today; weekStart = mondayOf(today); }
  tab = t; profileKey = null; flash = ""; try { localStorage.setItem("tab", t); } catch (e) {} render(); window.scrollTo(0, 0); }

// ---------------------------------------------------------------- events
document.addEventListener("click", async e => {
  // Tap a long note (not a link inside it) to show all of it.
  const longNote = e.target.closest(".note p");
  if (longNote && !e.target.closest("a")) { longNote.classList.add("open"); return; }
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.profile) { profileKey = d.profile; if (tab === "admin") tab = "day"; render(); return window.scrollTo(0, 0); }
  if (t.id === "goto-reflect") {
    openPanel(today, myKey());
    const el = document.getElementById("panel-refl");
    if (el) el.scrollIntoView({ block: "start" });
    return;
  }
  if (t.id === "profile-back") { profileKey = null; render(); return window.scrollTo(0, 0); }
  if (d.tick) { const [key, r] = d.tick.split(":"); return editTick(selected, key, row => { row[r] = !row[r]; }); }
  if (d.edit) return openPanel(selected, d.edit);
  if (t.id === "open-settings") return openSettings();
  if (d.remind) {
    remindMins = +d.remind;
    try { localStorage.setItem("remindMins", d.remind); } catch (e) {}
    renderRemind();
    return savePushSub().catch(err => { push.msg = err.message; renderRemind(); });
  }
  if (t.id === "retry-load") { t.disabled = true; try { await refreshNow(); } catch (err) { render(); } return; }
  if (t.id === "install-app" && installPrompt) { installPrompt.prompt(); installPrompt = null; t.remove(); return; }
  if (t.id === "show-add-break") { const row = document.getElementById("add-break-row"); row.hidden = false; document.getElementById("newbreak").focus(); return; }
  if (t.id === "add-break") return addCustomBreak();
  if (d.hideBreak || d.unhideBreak) {
    const b = d.hideBreak || d.unhideBreak, hidden = settings.hiddenBreaks || [];
    settings.hiddenBreaks = d.hideBreak ? [...new Set([...hidden, b])] : hidden.filter(x => x !== b);
    saveSettings();
    document.getElementById("settings-breaks").innerHTML = customBreaksListHtml();
    return;
  }
  if (d.removeCustom) {
    settings.customBreaks = (settings.customBreaks || []).filter(x => x !== d.removeCustom);
    saveSettings();
    document.getElementById("settings-breaks").innerHTML = customBreaksListHtml();
    return;
  }
  if (d.themeSet) {
    settings.theme = d.themeSet; saveSettings();
    document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === settings.theme)));
    return;

}
function restoreSnapshot() {
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(snapKey()) || "null"); } catch (e) {}
  if (!snap || !snap.groups) return false;
  gid = snap.gid; groups = snap.groups; myMemberships = snap.myMemberships; profile = snap.profile; isAppOwner = snap.isAppOwner;
  members = snap.members; HOLIDAYS = new Set(snap.holidays || []);
  ticks = {}; (snap.ticks || []).forEach(r => { ticks[r.day + "|" + r.member_key] = r; });
  reflections = {}; (snap.reflections || []).forEach(r => { reflections[r.week_start + "|" + r.member_key] = r; });
  applyGroupRules(group());
  isAdmin = canManageGroup(); people = [];
  applyOutbox();
  today = currentTradingDay(); selected = today; weekStart = mondayOf(today);
  if (tab === "admin") tab = "day";
  offlineSince = snap.at; loaded = true; screen = "app"; error = "";
  render();
  return true;
}
var OUTBOX = "outbox";
function getOutbox() { try { return JSON.parse(localStorage.getItem(OUTBOX) || "{}"); } catch (e) { return {}; } }
function putOutbox(o) { try { localStorage.setItem(OUTBOX, JSON.stringify(o)); } catch (e) {} }
// Show ticks still waiting to upload (they're newer than what the server sent).
function applyOutbox() {
  const o = getOutbox();
  for (const id in o) if (members.some(m => m.key === o[id].member_key)) ticks[id] = Object.assign({}, ticks[id], o[id]);
}
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|offline|internet/i.test((e && e.message) || "");
let flushing = false;
async function flushOutbox() {
  if (flushing || !session || !navigator.onLine) return;
  const o = getOutbox(), ids = Object.keys(o);
  if (!ids.length) return;
  flushing = true;
  for (const id of ids) {
    let e;
    try { ({ error: e } = await sb.from("ticks").upsert(o[id], { onConflict: "day,member_key" })); }
    catch (err) { e = { message: "network: " + err.message }; }
    if (e && isNetErr(e)) break;   // still no connection: try again later
    const cur = getOutbox();
    if (JSON.stringify(cur[id]) === JSON.stringify(o[id])) delete cur[id];   // unless you changed it again meanwhile
    putOutbox(cur);
    if (e) error = e.code === "42501" || /row-level security/i.test(e.message)
      ? `A tick from ${fmtDay(o[id].day)} couldn't upload: that day closed before you were back online.` : "Not saved: " + e.message;
    else if (noteState[id] === "offline") noteState[id] = "saved";
  }
  flushing = false;
  render();
}
window.addEventListener("online", async () => {
  offline = false; render();
  if (screen === "app" && offlineSince) { try { await refreshNow(); } catch (e) {} }
  flushOutbox();
});
window.addEventListener("offline", () => { offline = true; render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveSnapshot(); });
function offlineBar() {
  const n = Object.keys(getOutbox()).length;
  if (!offline && !offlineSince && !n) return "";
  const when = offlineSince ? new Date(offlineSince).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  const text = offline ? "You're offline. Your ticks are saved on this device and upload when you're back online."
    : offlineSince ? "Can't reach the server right now." : `${n} tick${n > 1 ? "s" : ""} waiting to upload.`;
  return `<div class="offline-bar" role="status">${ic("alert", 16)}<span>${text}${offlineSince ? ` Showing what was loaded at ${when}.` : ""}</span>
    ${!offline ? `<button class="linkbtn" id="retry-load">Try again</button>` : ""}</div>`;
}
// Start: load from the server; if that's impossible, open the copy saved on this device.
async function startLoad() {
  if (!navigator.onLine && restoreSnapshot()) return;
  try {
    await loadAll();
    loadPush();
  } catch (err) {
    if (isNetErr(err) || !navigator.onLine || /Couldn't load groups: (TypeError|Failed|Load failed)/i.test(err.message)) {
      if (restoreSnapshot()) return;
      screen = "offline"; clearTimeout(loadTimer); return render();
    }
    throw err;
  }
}

// ---------------------------------------------------------------- reminders (notifications)
// Settings → Reminders asks for permission and saves this device's push address in the database. The
// send-reminders function (supabase/functions) then notifies you if your homework isn't done before the day closes.
const VAPID = cfg.vapidPublicKey || "";
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const push = { sub: null, busy: false, msg: "" };
let remindMins = 60;
try { remindMins = +localStorage.getItem("remindMins") || 60; } catch (e) {}
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
// The background helper (sw.js); null if it isn't running.
function swReg() {
  if (!("serviceWorker" in navigator)) return Promise.resolve(null);
  return Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 6000))]);
}
async function loadPush() {
  if (!VAPID || !pushSupported() || !session) return;
  try { const reg = await swReg(); push.sub = reg ? await reg.pushManager.getSubscription() : null; } catch (e) { push.sub = null; }
  // Keeps this device's address up to date and under the account that's signed in now.
  if (push.sub && Notification.permission === "granted") savePushSub().catch(() => {});
  renderRemind();
}
async function savePushSub() {
  const j = push.sub.toJSON();
  const { error: e } = await sb.rpc("save_push_subscription", { sub_endpoint: j.endpoint, sub_p256dh: j.keys.p256dh, sub_auth: j.keys.auth, sub_minutes: remindMins });
  if (e) throw new Error(/function|schema cache/i.test(e.message) ? "Reminders aren't set up yet (database update 10)." : e.message);
}
async function turnRemindersOn() {
  const asked = Notification.requestPermission();   // first, while it still counts as your tap
  push.busy = true; push.msg = ""; renderRemind();
  try {
    const perm = await asked;
    if (perm !== "granted") throw new Error(perm === "denied" ? "" : "You didn't allow notifications.");
    const reg = await swReg();
    if (!reg) throw new Error("Reminders couldn't start. Reload the page and try again.");
    push.sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(VAPID) });
    await savePushSub();
    reg.showNotification("Reminders are on", { body: "You'll get a notification here if your homework isn't done before the day closes.", icon: "icons/icon-192.png", tag: "remind-on" });
  } catch (e) { push.msg = e.message || String(e); }
  push.busy = false; renderRemind();
}
async function turnRemindersOff() {
  push.busy = true; renderRemind();
  try {
    if (push.sub) { await sb.from("push_subscriptions").delete().eq("endpoint", push.sub.endpoint); await push.sub.unsubscribe(); }
  } catch (e) {}
  push.sub = null; push.busy = false; push.msg = ""; renderRemind();
}
function remindHtml() {
  if (!VAPID) return "";
  const head = `<h3>Reminders</h3>`;
  if (!pushSupported()) return head + `<p class="sub-hint">${isIOS() && !isInstalled()
    ? "On iPhone, reminders work in the app: add LockedIn to your Home Screen first (see <b>App on your phone</b>), then open it from there and turn reminders on."
    : "This browser can't show reminders. Try Chrome, Edge, Firefox or Safari."}</p>`;
  const blocked = Notification.permission === "denied", on = !!push.sub && Notification.permission === "granted";
  const opt = (m, l) => `<button data-remind="${m}" aria-pressed="${remindMins === m}">${l}</button>`;
  return head + `<label class="switchrow"><span><b>Remind me</b><small>A notification on this ${isWide() ? "computer" : "phone"} if your homework isn't done before the day closes.</small></span>
      <input type="checkbox" id="set-remind" role="switch" ${on ? "checked" : ""} ${push.busy || blocked ? "disabled" : ""}></label>
    ${on ? `<div class="segset four" role="group" aria-label="How long before the day closes">${opt(30, "30 min")}${opt(60, "1 hour")}${opt(120, "2 hours")}${opt(180, "3 hours")}</div>
      <p class="sub-hint" style="margin-top:8px">before the day closes. Turn it on on each phone or computer you use.</p>` : ""}
    ${blocked ? `<p class="sub-hint bad">Notifications are blocked for this site. Allow them in ${isIOS() ? "iPhone Settings → Notifications → LockedIn" : "your browser's site settings (the icon left of the address)"}, then reload.</p>` : ""}
    ${push.msg ? `<p class="sub-hint bad">${esc(push.msg)}</p>` : ""}`;
}
function renderRemind() { const el = document.getElementById("remind-box"); if (el) el.innerHTML = remindHtml(); }
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------------------------------------------------------------- errors
// If something breaks, show what went wrong (and a reload button) instead of an endless "Loading…".
function showCrash(err) {
  const msg = err && err.message ? err.message + (err.stack && !err.stack.includes(err.message) ? "\n\n" + err.stack : "") : String(err);
  console.error(err);
  const app = document.getElementById("app");
  if (!app || app.dataset.crashed) return;
  app.dataset.crashed = "1";
  app.innerHTML = `<div class="card"><p class="msg err"><b>Something went wrong.</b> Send your group owner a screenshot of this box.</p>
    <pre style="white-space:pre-wrap;font:12px/1.4 var(--font-data);color:var(--text-2);margin:10px 0">${esc(msg).slice(0, 1200)}</pre>
    <button class="btn plain small" onclick="location.reload()">Reload</button></div>`;
}
window.addEventListener("error", e => showCrash(e.error || e.message));
window.addEventListener("unhandledrejection", e => showCrash(e.reason));
let loadTimer = null;
function watchLoading() {
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => {
    if (screen === "loading") showCrash(new Error(`Still loading after 15 seconds (stuck at: ${loadStep}). ` +
      "Tap Reload. If it keeps happening, send your group owner this message."));
  }, 15000);
}
watchLoading();

// ---------------------------------------------------------------- start
(async () => {
  if (!sb) { screen = "setup"; return render(); }
  sb.auth.onAuthStateChange((event, s) => {
    const was = session && session.user.id;
    session = s;
    if (!s) { screen = "signin"; profile = null; isAdmin = false; if (channel) { sb.removeChannel(channel); channel = null; } render(); }
    else if (s.user.id !== was) { screen = "loading"; render(); watchLoading(); setTimeout(startLoad, 0); }
  });
  const { data } = await sb.auth.getSession();
  if (!data.session) { screen = "signin"; render(); }
})();
</script>
</body>
</html>
