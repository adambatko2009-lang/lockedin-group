<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNQ Homework Tracker</title>
<meta name="theme-color" content="#0b0e10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f3" media="(prefers-color-scheme: light)">
<style>
  /* Layout: content cards scroll under floating glass bars (date bar on top, tab bar at the bottom on phones).
     Glass is only on those bars, never on content. Monitors get a two-column dashboard and no tab bar. */
  :root {
    --bg: #eef1f3; --surface: #ffffff; --surface-2: #eef1f3; --line: #dfe4e7;
    --text: #0e1316; --text-2: #3d474d; --muted: #5f6b72;
    --accent: #1f65b0; --accent-text: #1f65b0; --on-accent: #ffffff;
    --good: #1b7a33; --warn: #e9a521; --crit: #b83232; --on-good: #ffffff; --on-warn: #14110a; --on-crit: #ffffff;
    --discord: #5865f2;
    --glass: rgba(255, 255, 255, 0.62); --glass-edge: rgba(255, 255, 255, 0.75); --glass-shade: rgba(16, 24, 32, 0.14);
    --glass-pill: rgba(255, 255, 255, 0.9);
    --glow-a: rgba(31, 101, 176, 0.10); --glow-b: rgba(27, 122, 51, 0.08);
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-data: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e10; --surface: #161a1d; --surface-2: #1f2427; --line: #2b3236;
      --text: #eef1f2; --text-2: #b9c2c7; --muted: #9aa4aa;
      --accent: #2f6fb8; --accent-text: #6cb2f0; --on-accent: #ffffff;
      --good: #1f8a3b; --warn: #f2b33d; --crit: #c43d3d;
      --glass: rgba(30, 36, 40, 0.58); --glass-edge: rgba(255, 255, 255, 0.14); --glass-shade: rgba(0, 0, 0, 0.45);
      --glass-pill: rgba(255, 255, 255, 0.14);
      --glow-a: rgba(47, 111, 184, 0.16); --glow-b: rgba(31, 138, 59, 0.10);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0; min-height: 100%; color: var(--text); font: 16px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased;
    background: radial-gradient(60% 40% at 15% 0%, var(--glow-a), transparent 70%),
                radial-gradient(50% 40% at 100% 30%, var(--glow-b), transparent 70%), var(--bg);
    background-attachment: fixed;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

  /* ---------- glass: navigation layer only ---------- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-edge), 0 10px 30px var(--glass-shade);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--surface); } }
  @media (prefers-reduced-transparency: reduce) { .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  @media (prefers-contrast: more) { .glass { background: var(--surface); border-color: var(--text-2); } }

  .topbar {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5;
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 4px;
    border-radius: 999px; padding: 4px;
  }
  .topbar .mid { text-align: center; min-width: 0; line-height: 1.15; }
  .topbar .mid b { display: block; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .mid button { border: 0; background: none; color: var(--accent-text); font-size: 13px; font-weight: 600; padding: 2px 8px; min-height: 22px; cursor: pointer; }
  .topbar .mid small { display: block; font-size: 12px; color: var(--muted); }
  .topbar small.err, .topbar .err { color: var(--crit); }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; font-size: 22px; cursor: pointer; display: grid; place-items: center; }
  .round:not(:disabled):active { background: var(--glass-pill); transform: scale(0.92); }
  .round:disabled { opacity: 0.3; cursor: default; }

  .tabbar {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: min(380px, calc(100% - 32px));
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 5px; border-radius: 999px;
  }
  .tabbar .pill { position: absolute; top: 5px; bottom: 5px; left: 5px; border-radius: 999px;
                  background: var(--glass-pill); box-shadow: inset 0 1px 0 var(--glass-edge); }
  .tabbar button { position: relative; min-height: 50px; border: 0; background: transparent; border-radius: 999px; cursor: pointer;
                   display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--text-2); }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button span { font-size: 11px; font-weight: 600; }
  .tabbar button[aria-selected="true"] { color: var(--accent-text); }
  .tabbar button:active { transform: scale(0.94); }
  .tabbar .badge { position: absolute; top: 6px; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
                   background: var(--crit); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- content (solid, no glass) ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }
  .msg { font-size: 14px; color: var(--text-2); margin: 0; }
  .msg.err { color: var(--crit); }

  .track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); }
  .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--muted); opacity: 0.6; }
  .track .now { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 3px var(--surface); }
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; gap: 10px; }
  .meta .count { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .meta .count span { font-size: 17px; color: var(--muted); font-weight: 500; }
  .meta .time { font: 600 14px var(--font-data); color: var(--text-2); text-align: right; }
  .stack { display: flex; gap: 2px; height: 6px; margin-top: 12px; }
  .stack i { border-radius: 3px; min-width: 6px; }

  .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  .COMPLETE { background: var(--good); color: var(--on-good); }
  .PARTIAL { background: var(--warn); color: var(--on-warn); }
  .MISSING { background: var(--crit); color: var(--on-crit); }
  .WAITING, .UNLOGGED { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--muted); }
  .EXCUSED { background: var(--surface-2); color: var(--text-2); box-shadow: inset 0 0 0 1.5px var(--line); }

  .member { padding: 14px 0; border-top: 1px solid var(--line); }
  .member:first-child { border-top: 0; padding-top: 0; }
  .member:last-child { padding-bottom: 0; }
  .mrow { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .name { flex: 1; font-size: 17px; font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .you { font-size: 11px; font-weight: 700; color: var(--accent-text); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
  .icon { width: 44px; height: 44px; margin: -8px 0; border: 0; background: transparent; border-radius: 50%; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .icon svg { width: 19px; height: 19px; }
  .icon.has { color: var(--accent-text); }
  .icon:active { background: var(--surface-2); }
  .toggles { display: grid; grid-template-columns: repeat(3, 1fr) 1fr; gap: 6px; }
  .toggles .t:nth-child(4) { margin-left: 6px; }
  .t { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--text-2);
       font-size: 13px; font-weight: 600; line-height: 1.15; padding: 6px 4px; cursor: pointer; text-align: center; }
  .t.bonus { border-style: dashed; }
  .t[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .t[aria-pressed="true"]::before { content: "✓ "; font-weight: 800; }
  .t:not(:disabled):active { transform: scale(0.96); filter: brightness(0.92); }
  .t:disabled { cursor: default; }
  .member.locked .t:not([aria-pressed="true"]) { opacity: 0.55; }
  .note { margin-top: 8px; }
  .note p { margin: 0; font-size: 14px; color: var(--text-2); overflow-wrap: anywhere; }
  .note input { width: 100%; min-height: 42px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
                color: var(--text); font: 15px var(--font-ui); padding: 8px 12px; }
  .note input::placeholder { color: var(--muted); }
  .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .shot { width: 64px; height: 64px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2) center / cover no-repeat; cursor: zoom-in; }
  .shot.busy { cursor: default; display: grid; place-items: center; font-size: 11px; color: var(--muted); }
  .shot:active { transform: scale(0.96); }

  /* edit panel: a sheet from the bottom on phones, a drawer from the right on monitors */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.45); }
  .panel { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto;
           background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
           box-shadow: 0 -12px 40px var(--glass-shade);
           padding: 8px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
  .panel .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
  .panel header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .panel header b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .panel header span { font-size: 14px; color: var(--muted); }
  .panel h3 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin: 18px 0 8px; }
  .panel textarea { width: 100%; min-height: 96px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
                    color: var(--text); font: 16px/1.4 var(--font-ui); padding: 10px 12px; }
  .panel textarea::placeholder { color: var(--muted); }
  .panel .count-hint { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
  .pics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pic { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
  .pic > button.open { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: center / cover no-repeat; cursor: zoom-in; }
  .pic > button.remove { position: absolute; top: 6px; right: 6px; min-width: 32px; height: 32px; padding: 0 10px; border-radius: 16px; border: 0;
                         background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  .pic.busy { display: grid; place-items: center; font-size: 13px; color: var(--muted); }
  .addpic { aspect-ratio: 4 / 3; border-radius: 12px; border: 1.5px dashed var(--muted); background: transparent; color: var(--accent-text);
            font-size: 15px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .addpic svg { width: 26px; height: 26px; }
  .addpic:active { transform: scale(0.98); }
  .panel .done { width: 100%; margin-top: 20px; justify-content: center; }
  .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); cursor: pointer; }
  .switchrow b { display: block; font-size: 16px; font-weight: 600; }
  .switchrow small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .switchrow input { appearance: none; -webkit-appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--line); position: relative; cursor: pointer; transition: background-color .2s; }
  .switchrow input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
  .switchrow input:checked { background: var(--good); }
  .switchrow input:checked::after { transform: translateX(20px); }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: sheet-up .28s cubic-bezier(.2, .9, .3, 1); }
    @keyframes sheet-up { from { transform: translateY(100%); } }
  }
  @media (min-width: 960px) {
    .panel { left: auto; top: 12px; bottom: 12px; right: 12px; width: 440px; max-height: none; border-radius: 20px; border: 1px solid var(--line);
             box-shadow: 0 20px 60px var(--glass-shade); padding: 20px 22px; }
    .panel .grab { display: none; }
    .pics { grid-template-columns: repeat(2, 1fr); }
    @media (prefers-reduced-motion: no-preference) {
      .panel { animation: drawer-in .28s cubic-bezier(.2, .9, .3, 1); }
      @keyframes drawer-in { from { transform: translateX(calc(100% + 24px)); } }
    }
  }

  /* full-size screenshot viewer */
  dialog#viewer { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; overflow: visible; }
  dialog#viewer::backdrop { background: rgba(0, 0, 0, 0.88); }
  dialog#viewer img { display: block; max-width: min(1200px, 94vw); max-height: 78vh; border-radius: 12px; margin: 0 auto; background: #111; }
  dialog#viewer .vbar { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
  dialog#viewer .vcap { text-align: center; color: #c9d1d6; font-size: 14px; margin-top: 10px; }

  .grid-wrap { overflow-x: auto; }
  table.grid { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; min-width: 300px; }
  .grid th { font: 600 12px var(--font-ui); color: var(--muted); padding-bottom: 2px; }
  .grid th.who { width: 31%; }
  .grid td.who { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell { width: 100%; height: 40px; border-radius: 10px; border: 0; font-size: 15px; font-weight: 800; cursor: pointer; display: grid; place-items: center; }
  .cell:active { transform: scale(0.94); }
  .cell.none { background: var(--surface-2); color: var(--muted); cursor: default; font-weight: 400; }
  .cell.today { outline: 2px solid var(--text); outline-offset: 1px; }

  .lb { list-style: none; margin: 0; padding: 0; }
  .lb li { display: grid; grid-template-columns: 24px 32px 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .lb li:first-child { border-top: 0; padding-top: 0; }
  .rk { font: 700 15px var(--font-data); color: var(--muted); text-align: center; }
  .lb li.top .rk { color: var(--text); }
  .who2 b { display: block; font-size: 17px; font-weight: 600; }
  .who2 span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pts { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  details { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); }
  details p { font-size: 14px; color: var(--text-2); margin: 8px 0 0; }
  .account { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .linkbtn { border: 0; background: none; color: var(--accent-text); font-size: 14px; font-weight: 600; cursor: pointer; min-height: 36px; padding: 0 4px; }

  /* ---------- sign-in, waiting, setup screens ---------- */
  .gate { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  .gate h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .gate p { color: var(--text-2); margin: 0 0 22px; }
  .gate .avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; display: block; background: var(--surface-2); }
  .btn { min-height: 48px; padding: 0 22px; border-radius: 14px; border: 0; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
  .btn:active { transform: scale(0.97); }
  .btn.discord { background: var(--discord); color: #fff; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.plain { background: var(--surface-2); color: var(--text); }
  .btn.small { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
  .btn.danger { background: transparent; color: var(--crit); box-shadow: inset 0 0 0 1.5px var(--line); }

  /* ---------- profile + achievements ---------- */
  .namebtn { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; max-width: 100%;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .namebtn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .av { position: relative; flex: none; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; color: #fff; font-weight: 700; line-height: 1; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .phead { display: flex; align-items: center; gap: 14px; }
  .phead h1 { font-size: 24px; letter-spacing: -0.02em; margin: 0; }
  .phead p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .tile { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12px; color: var(--muted); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 10px; }
  .badge { text-align: center; min-width: 0; }
  .medal { width: 56px; height: 56px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
           background: color-mix(in srgb, var(--tier) 22%, var(--surface)); box-shadow: inset 0 0 0 2.5px var(--tier); }
  .badge.locked .medal { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); }
  .badge.locked .medal span { filter: grayscale(1); opacity: 0.35; }
  .badge b { display: block; font-size: 13px; font-weight: 600; line-height: 1.2; }
  .badge small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: capitalize; }
  .badge .bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin: 6px 8px 0; overflow: hidden; }
  .badge .bar i { display: block; height: 100%; background: var(--accent-text); border-radius: 2px; }
  .tier-bronze { --tier: #c27c48; } .tier-silver { --tier: #9fb0bb; } .tier-gold { --tier: #e3b341; }
  .tier-diamond { --tier: #5cc8f0; } .tier-legend { --tier: #b37df0; }
  .mini-badge { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; margin-left: 6px; vertical-align: -4px;
                background: color-mix(in srgb, var(--tier) 22%, var(--surface)); box-shadow: inset 0 0 0 1.5px var(--tier); }
  .heat-wrap { overflow-x: auto; }
  table.heat { border-collapse: separate; border-spacing: 3px; }
  .heat th { font: 600 11px var(--font-ui); color: var(--muted); text-align: left; padding-right: 4px; }
  .heat td i { display: block; width: 16px; height: 16px; border-radius: 4px; background: var(--surface-2); }
  .heat td i.none { background: transparent; }
  .heat td i.COMPLETE { background: var(--good); }
  .heat td i.PARTIAL { background: var(--warn); }
  .heat td i.MISSING { background: var(--crit); }
  .heat td i.WAITING, .heat td i.UNLOGGED, .heat td i.EXCUSED { background: var(--surface-2); box-shadow: none; }
  .jentry { padding: 12px 0; border-top: 1px solid var(--line); }
  .jentry:first-of-type { border-top: 0; padding-top: 0; }
  .jentry .jd { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
  .jentry p { margin: 6px 0 0; font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
  .toast { position: fixed; z-index: 30; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%);
           display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 999px; max-width: calc(100% - 32px); }

<body>
<main>
  <div class="topbar glass" id="topbar" hidden></div>
  <div id="app"><div class="card"><p class="msg">Loading…</p></div></div>
</main>
<nav class="tabbar glass" id="tabbar" role="tablist" aria-label="View" hidden></nav>
<input type="file" id="shotinput" accept="image/*" hidden>
<div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden></aside>
<dialog id="viewer" aria-label="Screenshot">
  <img id="viewer-img" alt="">
  <div class="vcap" id="viewer-cap"></div>
  <div class="vbar"><button class="btn plain small" id="viewer-close">Close</button><button class="btn danger small" id="viewer-delete">Delete</button></div>
</dialog>

<script>
// ---------------------------------------------------------------- rules (change these here, on GitHub)
const RULES = [["chart", "Chart with execution", "req"], ["journal", "Journal", "req"], ["review", "HTF", "req"], ["social", "Social", "bonus"]];
const REQUIRED = RULES.filter(r => r[2] === "req").map(r => r[0]);
const POINTS = { COMPLETE: 2, PARTIAL: 1, MISSING: 0, bonus: 1 };
const CUTOFF_HOUR = 9;  // New York time; must match current_trading_day() in supabase/setup.sql

const ICON = { COMPLETE: "✓", PARTIAL: "◐", MISSING: "✕", WAITING: "", UNLOGGED: "?", EXCUSED: "E" };
const LABEL = { COMPLETE: "Complete", PARTIAL: "Partial", MISSING: "Missing", WAITING: "Waiting", UNLOGGED: "Not logged", EXCUSED: "Excused" };
const STATUS_ORDER = ["COMPLETE", "PARTIAL", "MISSING", "WAITING", "UNLOGGED", "EXCUSED"];
const STATUS_COLOR = { COMPLETE: "var(--good)", PARTIAL: "var(--warn)", MISSING: "var(--crit)", WAITING: "var(--line)", UNLOGGED: "var(--line)", EXCUSED: "var(--muted)" };
const SVG = {
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>`,
  day: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>`,
  week: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>`,
  board: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>`,
  admin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11l2 2 4-4"/></svg>`,
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`,
  discord: `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.5 0L8.7 3a19.6 19.6 0 0 0-4.9 1.5C.7 9.1-.2 13.6.3 18a19.8 19.8 0 0 0 6 3l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12 0l.5.4-2 1 1.3 2.1a19.7 19.7 0 0 0 6-3c.6-5.1-.8-9.6-3.6-13.6ZM8.1 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm7.8 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>`,
};

// ---------------------------------------------------------------- dates (New York trading days)
let HOLIDAYS = new Set();
const parse = k => new Date(k + "T12:00:00Z");
const keyOf = d => d.toISOString().slice(0, 10);
const addDays = (k, n) => { const d = parse(k); d.setUTCDate(d.getUTCDate() + n); return keyOf(d); };
const isTradingDay = k => { const w = parse(k).getUTCDay(); return w > 0 && w < 6 && !HOLIDAYS.has(k); };
const prevTrading = k => { do k = addDays(k, -1); while (!isTradingDay(k)); return k; };
const nextTrading = k => { do k = addDays(k, 1); while (!isTradingDay(k)); return k; };
const mondayOf = k => addDays(k, -((parse(k).getUTCDay() + 6) % 7));
const fmtDay = (k, o) => parse(k).toLocaleDateString("en-GB", Object.assign({ weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }, o));

function nyParts(ms) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    .formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return { key: `${p.year}-${p.month}-${p.day}`, hour: +p.hour, minute: +p.minute };
}
// The real moment of HH:00 New York time on a given date (handles daylight saving).
function nyMoment(k, hour) {
  const guess = Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10), hour);
  const p = nyParts(guess);
  const seen = Date.UTC(+p.key.slice(0, 4), +p.key.slice(5, 7) - 1, +p.key.slice(8, 10), p.hour, p.minute);
  return new Date(guess - (seen - guess));
}
function currentTradingDay() {
  const p = nyParts(Date.now());
  let k = p.key;
  if (p.hour < CUTOFF_HOUR) k = addDays(k, -1);
  while (!isTradingDay(k)) k = addDays(k, -1);
  return k;
}
const opensAt = k => nyMoment(k, CUTOFF_HOUR);
const closesAt = k => nyMoment(nextTrading(k), CUTOFF_HOUR);
const isFinal = k => Date.now() >= closesAt(k).getTime();

// ---------------------------------------------------------------- state
const cfg = window.MNQ_CONFIG || {};
const configured = cfg.supabaseUrl && !cfg.supabaseUrl.startsWith("PASTE") && cfg.supabaseAnonKey && !cfg.supabaseAnonKey.startsWith("PASTE");
const sb = configured && window.supabase ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey) : null;

let screen = "loading";          // loading | setup | signin | waiting | rejected | app
let session = null, profile = null, isAdmin = false;
let members = [];                // [{key, name, sort, active}]
let ticks = {};                  // "day|member" -> row
let people = [];                 // admin only: all profiles
let today = currentTradingDay();
let selected = today, weekStart = mondayOf(today), editing = null;   // editing = {day, key} while the edit panel is open
let tab = "day";
let profileKey = null;   // whose profile page is open
try { const t = localStorage.getItem("tab"); if (t) tab = t; } catch (e) {}
let error = "", saving = 0, loaded = false, channel = null;
let reflections = {};           // "monday|member" -> {week_start, member_key, went_well, to_fix}

const myKey = () => (profile && profile.status === "approved" ? profile.member_key : null);
const activeMembers = () => members.filter(m => m.active).sort((a, b) => a.sort - b.sort || a.name.localeCompare(b.name));
const tickOf = (k, key) => ticks[k + "|" + key] || null;
const dayHasAny = k => Object.entries(ticks).some(([id, r]) => id.startsWith(k + "|") && !r.excused);
const canEdit = (k, key) => isAdmin || (key === myKey() && k === today && !isFinal(k));

function statusOf(k, key) {
  const rec = tickOf(k, key);
  if (rec && rec.excused) return "EXCUSED";   // set by the admin: sick, travelling...
  // On a no-trade day (sat out, no setup) the chart isn't required; journal + HTF still are.
  const need = rec && rec.no_trade ? REQUIRED.filter(r => r !== "chart") : REQUIRED;
  const req = rec ? need.filter(r => rec[r]).length : 0;
  if (req === need.length) return "COMPLETE";
  if (req > 0) return "PARTIAL";
  if (!isFinal(k)) return "WAITING";       // the day is still open, nothing yet isn't a fail
  if (!dayHasAny(k)) return "UNLOGGED";      // nobody logged anything that day: don't count it
  return "MISSING";
}

// ---------------------------------------------------------------- data
async function loadAll() {
  const [{ data: prof }, { data: adm }] = await Promise.all([
    sb.from("profiles").select("*").eq("user_id", session.user.id).maybeSingle(),
    sb.from("admins").select("user_id").eq("user_id", session.user.id),
  ]);
  profile = prof; isAdmin = !!(adm && adm.length);
  if (!isAdmin && (!profile || profile.status === "pending")) { screen = "waiting"; return render(); }
  if (!isAdmin && profile.status === "rejected") { screen = "rejected"; return render(); }

  const [m, h, t] = await Promise.all([
    sb.from("members").select("*"),
    sb.from("holidays").select("day"),
    sb.from("ticks").select("*").order("day", { ascending: false }).limit(5000),
  ]);
  const failed = [m, h, t].find(r => r.error);
  if (failed) { error = "Couldn't load data: " + failed.error.message; }
  members = m.data || [];
  HOLIDAYS = new Set((h.data || []).map(r => r.day));
  ticks = {};
  (t.data || []).forEach(r => { ticks[r.day + "|" + r.member_key] = r; });
  today = currentTradingDay();
  if (selected > today || !isTradingDay(selected)) selected = today;
  weekStart = mondayOf(selected);
  // Weekly reflections (update 5). If that update isn't installed yet, the rest still works.
  const rf = await sb.from("reflections").select("*").order("week_start", { ascending: false }).limit(3000);
  reflections = {};
  if (!rf.error) (rf.data || []).forEach(r => { reflections[r.week_start + "|" + r.member_key] = r; });
  if (isAdmin) await loadPeople();
  if (!isAdmin && tab === "admin") tab = "day";
  loaded = true; screen = "app";
  subscribe();
  render();
}

async function loadPeople() {
  const { data, error: e } = await sb.from("profiles").select("*").order("created_at");
  if (e) error = e.message; else people = data || [];
}

function subscribe() {
  if (channel) return;
  channel = sb.channel("ticks-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "ticks" }, payload => {
      const row = payload.new && payload.new.day ? payload.new : payload.old;
      if (!row || !row.day) return;
      const id = row.day + "|" + row.member_key;
      if (payload.eventType === "DELETE") delete ticks[id];
      else if (!pending[id]) ticks[id] = payload.new;   // don't overwrite a tick you're still saving
      render();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "reflections" }, payload => {
      const row = payload.new && payload.new.week_start ? payload.new : payload.old;
      if (!row || !row.week_start) return;
      const id = row.week_start + "|" + row.member_key;
      if (payload.eventType === "DELETE") delete reflections[id];
      else if (!pendingRefl[id]) reflections[id] = payload.new;
      render();
    })
    .subscribe();
}

// One save at a time per row; quick taps are combined into one save.
const pending = {}, timers = {};
function editTick(k, key, mutate, quiet) {
  if (!canEdit(k, key)) return;
  const id = k + "|" + key;
  const row = Object.assign({ day: k, member_key: key, chart: false, journal: false, review: false, social: false, note: "", images: [], no_trade: false }, tickOf(k, key));
  row.images = [...(row.images || [])];
  mutate(row);
  ticks[id] = row; pending[id] = true;
  if (quiet) renderTop(); else render();
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => saveTick(id), 450);
}
async function saveTick(id) {
  const row = ticks[id];
  const body = { day: row.day, member_key: row.member_key, chart: !!row.chart, journal: !!row.journal, review: !!row.review, social: !!row.social, note: row.note || "", images: row.images || [], excused: !!row.excused, no_trade: !!row.no_trade };
  saving++; renderTop();
  const { error: e } = await sb.from("ticks").upsert(body, { onConflict: "day,member_key" });
  saving--;
  delete pending[id];
  if (e) {
    error = e.code === "42501" || /row-level security/i.test(e.message)
      ? "Not saved: this day is closed or the row isn't yours."
      : "Not saved: " + e.message;
    const { data } = await sb.from("ticks").select("*").eq("day", row.day).eq("member_key", row.member_key).maybeSingle();
    if (data) ticks[id] = data; else delete ticks[id];
  } else error = "";
  render();
}

// ---------------------------------------------------------------- weekly reflection
// Each member writes their own for the current week (Friday's day stays open until Monday 09:00 New York).
const pendingRefl = {}, reflTimers = {};
const canEditReflection = (week, key) => !!key && (isAdmin || (key === myKey() && week === mondayOf(today)));
function editReflection(week, key, field, value) {
  if (!canEditReflection(week, key)) return;
  const id = week + "|" + key;
  reflections[id] = Object.assign({ week_start: week, member_key: key, went_well: "", to_fix: "" }, reflections[id], { [field]: value });
  pendingRefl[id] = true;
  renderTop();
  clearTimeout(reflTimers[id]);
  reflTimers[id] = setTimeout(() => saveReflection(id), 700);
}
async function saveReflection(id) {
  const r = reflections[id];
  saving++; renderTop();
  const { error: e } = await sb.from("reflections").upsert(
    { week_start: r.week_start, member_key: r.member_key, went_well: r.went_well || "", to_fix: r.to_fix || "" }, { onConflict: "week_start,member_key" });
  saving--;
  delete pendingRefl[id];
  error = e ? "Reflection not saved: " + (/row-level security|42501/.test(e.message + e.code) ? "this week is closed." : e.message) : "";
  renderTop();
}

function renderReflections() {
  const week = weekStart, me = myKey(), editable = canEditReflection(week, me);
  const label = `${fmtDay(week, { weekday: undefined })} – ${fmtDay(addDays(week, 4), { weekday: undefined })}`;
  const mineRow = reflections[week + "|" + me] || {};
  const form = editable ? `<form onsubmit="return false">
      <label for="refl-well">What went well</label>
      <textarea id="refl-well" data-refl="went_well" data-week="${week}" maxlength="600" placeholder="Patience on entries, followed the plan…">${esc(mineRow.went_well)}</textarea>
      <label for="refl-fix">What to fix next week</label>
      <textarea id="refl-fix" data-refl="to_fix" data-week="${week}" maxlength="600" placeholder="Stop moving my stop, size down after a loss…">${esc(mineRow.to_fix)}</textarea>
      <p class="hint">Saves automatically · the whole group can read it</p></form>` : "";
  const entries = activeMembers().filter(m => !(editable && m.key === me)).map(m => {
    const r = reflections[week + "|" + m.key];
    if (!r || !(r.went_well || r.to_fix)) return "";
    return `<div class="rentry"><div class="who">${avatarHtml(m, 24)}<button class="namebtn" data-profile="${m.key}">${esc(m.name)}</button></div>

  }).join("");

    ${form}${entries || (form ? "" : `<p class="empty">No reflections for this week.</p>`)}</div>`;
}

// ---------------------------------------------------------------- screenshots
// Stored privately in Supabase Storage as <day>/<member>/<time>.jpg; shown through short-lived signed links.
const MAX_SHOTS = 4;
const shotUrls = {}, shotRequested = new Set(), uploading = {};
let shotTarget = null, viewing = null;

function ensureShotUrls(paths) {
  const missing = paths.filter(p => !shotUrls[p] && !shotRequested.has(p));
  if (!missing.length) return;
  missing.forEach(p => shotRequested.add(p));
  sb.storage.from("screenshots").createSignedUrls(missing, 3600).then(({ data }) => {
    (data || []).forEach(d => { if (d.signedUrl) shotUrls[d.path] = d.signedUrl; });
    render();
  });
}
// Signed links last an hour; refresh them before they run out.
setInterval(() => { Object.keys(shotUrls).forEach(p => delete shotUrls[p]); shotRequested.clear(); if (screen === "app") render(); }, 50 * 60000);

// Shrink to max 1600px and JPEG, so a screenshot is ~200-300 KB instead of several MB.
async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error("couldn't read this image (try a PNG or JPG)"));
      img.src = src;
    });
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.82));
    if (!blob) throw new Error("couldn't read this image");
    return blob;
  } finally { URL.revokeObjectURL(src); }
}

async function uploadShot(day, key, file) {
  if (!canEdit(day, key) || !file) return;
  if (((tickOf(day, key) || {}).images || []).length >= MAX_SHOTS) { error = `Max ${MAX_SHOTS} screenshots per day.`; return render(); }
  uploading[key] = (uploading[key] || 0) + 1; render();
  try {
    const blob = await shrink(file);
    const path = `${day}/${key}/${Date.now()}.jpg`;
    const { error: e } = await sb.storage.from("screenshots").upload(path, blob, { contentType: "image/jpeg", upsert: false });
    if (e) throw e;
    shotUrls[path] = URL.createObjectURL(blob);
    error = "";
    editTick(day, key, row => { row.images = [...row.images, path]; });
  } catch (e) {
    error = "Screenshot not saved: " + (/row-level security|unauthorized|403/i.test(e.message || "") ? "this day is closed or the row isn't yours." : (e.message || e));
  } finally {
    uploading[key]--; render();
  }
}

function stats(key) {
  const days = [...new Set(Object.keys(ticks).map(id => id.split("|")[0]))].filter(isTradingDay).sort();
  let points = 0, run = 0, best = 0, closed = 0, complete = 0, last = null;
  let noTrades = 0, completeDays = 0, social = 0, notes = 0, pics = 0, comebacks = 0, prevSt = null, since = null;
  const weeks = {};   // monday -> {n: closed days counted, ex: excused days, ok: all Complete, open: has an open day}
  for (const k of days) {
    if (last && nextTrading(last) !== k) run = 0;   // an unlogged trading day in between breaks a streak
    last = k;
    const raw = tickOf(k, key), rec = raw || {}, st = statusOf(k, key);
    const w = weeks[mondayOf(k)] = weeks[mondayOf(k)] || { n: 0, ex: 0, ok: true, open: false };
    if (rec.note) notes++;
    pics += (rec.images || []).length;
    if (st === "EXCUSED") { w.ex++; continue; }   // no points, no streak change, not counted in %
    if (raw && !since) since = k;
    if (rec.social) social++;
    points += (POINTS[st] || 0) + POINTS.bonus * (rec.social ? 1 : 0);
    if (st === "COMPLETE") { run++; best = Math.max(best, run); completeDays++; if (prevSt === "MISSING") comebacks++; if (rec.no_trade) noTrades++; }
    else if (isFinal(k)) run = 0;
    if (isFinal(k)) { closed++; if (st === "COMPLETE") complete++; prevSt = st; w.n++; if (st !== "COMPLETE") w.ok = false; }
    else w.open = true;
  }
  if (last && last !== today && nextTrading(last) < today) run = 0;
  // A perfect week: every trading day Mon-Fri closed and Complete (excused days are skipped).
  const perfectWeeks = Object.entries(weeks).filter(([mon, w]) =>
    w.ok && !w.open && w.n > 0 && w.n + w.ex === [0, 1, 2, 3, 4].filter(i => isTradingDay(addDays(mon, i))).length).length;
  return { points, run, best, rate: closed ? Math.round(100 * complete / closed) : null,
           completeDays, social, notes, pics, comebacks, perfectWeeks, noTrades, since };
}

// ---------------------------------------------------------------- achievements
const TIERS = ["bronze", "silver", "gold", "diamond", "legend"];
const ACHIEVEMENTS = [
  { id: "streak",   icon: "🔥", unit: "day streak",        metric: s => s.best,         goals: [5, 10, 20, 50, 100] },
  { id: "complete", icon: "✅", unit: "complete days",     metric: s => s.completeDays, goals: [10, 25, 50, 100, 250] },
  { id: "week",     icon: "📅", unit: "perfect weeks",     metric: s => s.perfectWeeks, goals: [1, 4, 12], one: "Perfect week" },
  { id: "shots",    icon: "📸", unit: "screenshots",       metric: s => s.pics,         goals: [1, 25, 100], one: "First screenshot" },
  { id: "notes",    icon: "✍️", unit: "journal notes",     metric: s => s.notes,        goals: [10, 50, 150] },
  { id: "social",   icon: "📣", unit: "social posts",      metric: s => s.social,       goals: [5, 25, 100] },
  { id: "points",   icon: "💎", unit: "points",            metric: s => s.points,       goals: [100, 500, 1000] },
  { id: "comeback", icon: "🔁", unit: "comebacks",         metric: s => s.comebacks,    goals: [1, 5], one: "Back on track" },
  { id: "patience", icon: "🧘", unit: "no-trade days",     metric: s => s.noTrades,     goals: [1, 10, 25], one: "Sat out" },
  { id: "first",    icon: "🎯", unit: "complete day",      metric: s => s.completeDays, goals: [1], one: "First complete" },
];
function badgesFor(s) {
  return ACHIEVEMENTS.flatMap(a => a.goals.map((goal, i) => {
    const have = a.metric(s);
    return { id: a.id + goal, icon: a.icon, tier: TIERS[i], goal, have: Math.min(have, goal), earned: have >= goal,
             title: goal === 1 && a.one ? a.one : `${goal} ${a.unit}` };
  }));
}
const topStreakBadge = s => badgesFor(s).filter(b => b.id.startsWith("streak") && b.earned).pop();
// Discord picture when we have one; otherwise (or if it fails to load) a colored circle with the initial.
function avatarHtml(m, px) {
  const url = m.avatar_url ? m.avatar_url + (m.avatar_url.includes("?") ? "&" : "?") + "size=" + (px > 40 ? 128 : 64) : "";
  return `<span class="av" style="width:${px}px;height:${px}px;font-size:${Math.round(px * 0.44)}px;background:${avatarColor(m.key)}" aria-hidden="true">${esc((m.name.trim()[0] || "?").toUpperCase())}${url
    ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>`;
}
const avatarColor = key => `hsl(${[...key].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7)} 45% 42%)`;

function rankOf(key) {
  const rows = activeMembers().map(m => ({ key: m.key, name: m.name, ...stats(m.key) }))
    .sort((a, b) => b.points - a.points || b.run - a.run || a.name.localeCompare(b.name));
  let rank = 0, prev = null;
  for (let i = 0; i < rows.length; i++) {
    if (!prev || rows[i].points !== prev.points || rows[i].run !== prev.run) rank = i + 1;
    prev = rows[i];
    if (rows[i].key === key) return rank;
  }
  return null;
}

  const since = s.since ? parse(s.since).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }) : "–";

  const head = `<div class="card">
    <div class="phead">${avatarHtml(m, 64)}
      <div><h1>${esc(m.name)}${key === myKey() ? `<span class="you">YOU</span>` : ""}</h1><p>Rank #${rankOf(key) || "–"} · since ${since}</p></div></div>
    <div class="tiles">
      <div class="tile"><b>${s.run}</b><span>Streak</span></div>
      <div class="tile"><b>${s.best}</b><span>Best streak</span></div>
      <div class="tile"><b>${s.rate === null ? "–" : s.rate + "%"}</b><span>Complete</span></div>
      <div class="tile"><b>${s.points}</b><span>Points</span></div>
      <div class="tile"><b>${s.completeDays}</b><span>Days done</span></div>
      <div class="tile"><b>${earned}</b><span>Badges</span></div>
    </div></div>`;

  const order = [...badges.filter(b => b.earned), ...badges.filter(b => !b.earned)];
  const ach = `<div class="card"><div class="cardhead"><h2>Achievements · ${earned}/${badges.length}</h2></div><div class="badges">
    ${order.map(b => `<div class="badge tier-${b.tier} ${b.earned ? "" : "locked"}" title="${esc(b.title)}">
      <div class="medal"><span>${b.icon}</span></div><b>${esc(b.title)}</b>
      ${b.earned ? `<small>${b.tier}</small>` : `<div class="bar" aria-label="${b.have} of ${b.goal}"><i style="width:${Math.round(100 * b.have / b.goal)}%"></i></div><small>${b.have}/${b.goal}</small>`}
    </div>`).join("")}</div></div>`;

  // Last 12 weeks, one column per week, Mon-Fri rows.
  const firstMon = addDays(mondayOf(today), -77);
  const weeksCols = Array.from({ length: 12 }, (_, i) => addDays(firstMon, i * 7));
  const heatRows = [0, 1, 2, 3, 4].map(d => `<tr><th>${["Mon", "", "Wed", "", "Fri"][d]}</th>${weeksCols.map(mon => {
    const k = addDays(mon, d);
    if (!isTradingDay(k) || k > today) return `<td><i class="none"></i></td>`;
    const st = statusOf(k, key);
    return `<td><i class="${st}" title="${fmtDay(k)}: ${LABEL[st]}"></i></td>`;
  }).join("")}</tr>`).join("");
  const heat = `<div class="card"><div class="cardhead"><h2>Last 12 weeks</h2></div><div class="heat-wrap"><table class="heat">${heatRows}</table></div></div>`;

  const entries = Object.values(ticks).filter(r => r.member_key === key && (r.note || (r.images || []).length))
    .sort((a, b) => b.day.localeCompare(a.day)).slice(0, 10);
  const paths = entries.flatMap(r => r.images || []);
  ensureShotUrls(paths);
  const journal = `<div class="card"><div class="cardhead"><h2>Recent journal</h2></div>${entries.length ? entries.map(r => `<div class="jentry">
      <div class="jd"><span>${fmtDay(r.day)}</span>${dot(statusOf(r.day, key))}</div>
      ${r.note ? `<p>${esc(r.note)}</p>` : ""}
      ${(r.images || []).length ? `<div class="shots">${r.images.map((p, i) => `<button class="shot" data-view-shot="${key}|${esc(p)}" aria-label="Picture ${i + 1}, ${fmtDay(r.day)}"
        style="${shotUrls[p] ? `background-image:url('${shotUrls[p]}')` : ""}"></button>`).join("")}</div>` : ""}
    </div>`).join("") : `<p class="empty">No notes or pictures yet.</p>`}</div>`;

  const refl = Object.values(reflections).filter(r => r.member_key === key && (r.went_well || r.to_fix))
    .sort((a, b) => b.week_start.localeCompare(a.week_start)).slice(0, 4);
  const reflCard = refl.length ? `<div class="card reflect"><div class="cardhead"><h2>Weekly reflections</h2></div>${refl.map(r => `<div class="rentry">
      <div class="who"><small>Week of ${fmtDay(r.week_start, { weekday: undefined })}</small></div>
      ${r.went_well ? `<h4>Went well</h4><p>${esc(r.went_well)}</p>` : ""}${r.to_fix ? `<h4>To fix</h4><p>${esc(r.to_fix)}</p>` : ""}</div>`).join("")}</div>` : "";
  return isWide()
    ? `<div class="desk"><div class="maincol">${head}${ach}</div><div class="side">${heat}${journal}${reflCard}</div></div>`
    : head + ach + heat + journal + reflCard;
}

// Pop up "Achievement unlocked" when you earn a new badge (remembered per browser).
let toastTimer = null;
function checkUnlocks() {
  if (!myKey() || !loaded || !session) return;
  const earned = badgesFor(stats(myKey())).filter(b => b.earned);
  const storeKey = "badges:" + session.user.id;
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(storeKey) || "null"); } catch (e) { return; }
  const ids = earned.map(b => b.id);
  try { localStorage.setItem(storeKey, JSON.stringify(ids)); } catch (e) {}
  if (!seen) return;   // first visit: just remember what you already have
  const fresh = earned.filter(b => !seen.includes(b.id));
  if (!fresh.length) return;
  const b = fresh[fresh.length - 1], t = document.getElementById("toast");
  t.innerHTML = `<div class="medal tier-${b.tier}"><span>${b.icon}</span></div><div><b>Achievement unlocked!</b><span>${esc(b.title)}${fresh.length > 1 ? ` · +${fresh.length - 1} more` : ""}</span></div>`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}

function renderBoard() {
  const rows = activeMembers().map(m => ({ name: m.name, key: m.key, m, ...stats(m.key) }))
    .sort((a, b) => b.points - a.points || b.run - a.run || a.name.localeCompare(b.name));
  let rank = 0, prev = null;
  const items = rows.map((r, i) => {
    if (!prev || r.points !== prev.points || r.run !== prev.run) rank = i + 1;
    prev = r;
    const detail = [r.run ? `${r.run}-day streak` : null, r.rate === null ? null : `${r.rate}%`].filter(Boolean).join(" · ") || "–";
    return `<li class="${rank === 1 && r.points ? "top" : ""}"><span class="rk">${rank}</span>${avatarHtml(r.m, 32)}
      <div class="who2"><b><button class="namebtn" data-profile="${r.key}">${esc(r.name)}</button>${(b => b ? `<span class="mini-badge tier-${b.tier}" title="${esc(b.title)}">${b.icon}</span>` : "")(topStreakBadge(r))}${r.key === myKey() ? `<span class="you">YOU</span>` : ""}</b><span>${detail}</span></div>
      <span class="pts" aria-label="${r.points} points">${r.points}</span></li>`;
  }).join("");
  const me = members.find(m => m.key === myKey());
  return `<div class="card">
    ${isWide() ? `<div class="cardhead"><h2>Ranking</h2></div>` : ""}
    <ol class="lb">${items}</ol>
    <details>
      <summary>Scoring</summary>
      <p>Complete (chart, journal, HTF) 2 pts · Partial 1 · Social +1. Streak = Complete days in a row. Excused (E) days don't count. You can tick your own boxes until 09:00 New York time on the next trading day.</p>
    </details>
    <div class="account"><span>${esc(me ? me.name : profile ? profile.discord_name : "")}${isAdmin ? " · admin" : ""}</span>
      <span>${me ? `<button class="linkbtn" data-profile="${me.key}">My profile</button>` : ""}<button class="linkbtn" id="signout">Sign out</button></span></div>
  </div>`;
}

function renderAdmin() {
  const free = activeMembers().filter(m => !people.some(p => p.member_key === m.key && p.status === "approved"));
  const avatar = p => p.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : `<span class="ph"></span>`;
  const memberOptions = (current) => `<option value="">Choose name…</option>` +
    activeMembers().filter(m => m.key === current || free.includes(m)).map(m => `<option value="${m.key}" ${m.key === current ? "selected" : ""}>${esc(m.name)}</option>`).join("");

  const waiting = people.filter(p => p.status === "pending");
  const approved = people.filter(p => p.status === "approved" && p.user_id !== session.user.id);
  const rejected = people.filter(p => p.status === "rejected");

  const waitingHtml = waiting.length ? waiting.map(p => `<div class="person">${avatar(p)}<b>${esc(p.discord_name)}</b>
      <span class="sub">Signed in ${new Date(p.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</span>
      <div class="actions"><select id="pick-${p.user_id}" aria-label="Name for ${esc(p.discord_name)}">${memberOptions(null)}</select>
        <button class="btn primary small" data-approve="${p.user_id}">Approve</button>
        <button class="btn danger small" data-reject="${p.user_id}">Reject</button></div></div>`).join("")
    : `<p class="empty">Nobody is waiting.</p>`;

  const approvedHtml = approved.length ? approved.map(p => {
    const m = members.find(x => x.key === p.member_key);
    return `<div class="person">${avatar(p)}<b>${esc(m ? m.name : "No name")}</b>
      <span class="sub">Discord: ${esc(p.discord_name)}</span>
      <div class="actions"><button class="btn danger small" data-revoke="${p.user_id}">Remove access</button></div></div>`;
  }).join("") : `<p class="empty">No one approved yet.</p>`;

  const rejectedHtml = rejected.length ? `<div class="card"><div class="cardhead"><h2>Rejected</h2></div>` + rejected.map(p => `<div class="person">${avatar(p)}<b>${esc(p.discord_name)}</b>
      <span class="sub">Rejected</span>
      <div class="actions"><button class="btn plain small" data-reconsider="${p.user_id}">Move back to waiting</button></div></div>`).join("") + `</div>` : "";

  const membersHtml = activeMembers().map(m => `<div class="mem">
      <input class="field" id="mname-${m.key}" value="${esc(m.name)}" maxlength="40" aria-label="Name">
      <button class="btn plain small" data-rename="${m.key}">Save</button>
      <button class="btn danger small" data-hide="${m.key}">Remove</button></div>`).join("");

  const cols = [
    `<div class="card"><div class="cardhead"><h2>Waiting for approval</h2></div>${waitingHtml}</div>
     <div class="card"><div class="cardhead"><h2>Approved</h2></div>${approvedHtml}</div>${rejectedHtml}`,
    `<div class="card"><div class="cardhead"><h2>Members</h2></div>${membersHtml}
      <div class="addrow"><input class="field" id="newmember" placeholder="New member name" maxlength="40" aria-label="New member name">
      <button class="btn primary small" id="addmember">Add</button></div>
      <p class="empty" style="margin-top:10px">Removing a member hides them; their history is kept.</p></div>`,
  ];
  const note = flash ? `<div class="card"><p class="msg">${esc(flash)}</p></div>` : error ? `<div class="card"><p class="msg err">${esc(error)}</p></div>` : "";
  return note + (isWide() ? `<div class="admin-grid"><div>${cols[0]}</div><div>${cols[1]}</div></div>` : cols.join(""));
}

function renderGate() {
  const name = profile ? profile.discord_name : (session && session.user.user_metadata && (session.user.user_metadata.full_name || session.user.user_metadata.name)) || "";
  const avatar = session && session.user.user_metadata && session.user.user_metadata.avatar_url;
  if (screen === "setup") return `<div class="gate card"><h1>Almost there</h1><p>Paste your Supabase address and key into <b>config.js</b>, then reload.</p></div>`;
  if (screen === "signin") return `<div class="gate"><h1>MNQ Homework</h1><p>Daily homework for the accountability group.</p>
    <button class="btn discord" id="signin">${SVG.discord}Sign in with Discord</button>
    ${error ? `<p class="msg err" style="margin-top:16px">${esc(error)}</p>` : ""}</div>`;
  if (screen === "waiting") return `<div class="gate">${avatar ? `<img class="avatar" src="${esc(avatar)}" alt="">` : ""}
    <h1>Waiting for approval</h1><p>Signed in as <b>${esc(name)}</b>. Batko will approve you soon; this page updates by itself.</p>
    <button class="btn plain" id="signout">Sign out</button></div>`;
  if (screen === "rejected") return `<div class="gate"><h1>No access</h1><p>This account (${esc(name)}) wasn't approved.</p>
    <button class="btn plain" id="signout">Sign out</button></div>`;
  return `<div class="card"><p class="msg">Loading…</p></div>`;
}

function render() {
  renderTop(); renderTabbar();
  const app = document.getElementById("app");
  if (screen !== "app") { app.innerHTML = renderGate(); return; }
  const f = document.activeElement, keep = f && f.id && f.id.startsWith("refl-") ? { id: f.id, a: f.selectionStart, b: f.selectionEnd } : null;
  if (tab === "admin" && isAdmin) app.innerHTML = renderAdmin();
  else if (profileKey) app.innerHTML = renderProfile(profileKey);
  else if (isWide()) {
    const d = renderDay();
    app.innerHTML = `<div class="desk"><div class="maincol">${d.summary}${d.list}</div><div class="side">${renderWeek()}${renderReflections()}${renderBoard()}</div></div>`;
  } else if (tab === "week") app.innerHTML = renderWeek() + renderReflections();
  else if (tab === "board") app.innerHTML = renderBoard();
  else { const d = renderDay(); app.innerHTML = d.summary + d.list; }
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.a, keep.b); } catch (e) {} } }
  renderPanelPics();
  checkUnlocks();
}

function setTab(t) { tab = t; profileKey = null; flash = ""; try { localStorage.setItem("tab", t); } catch (e) {} render(); window.scrollTo(0, 0); }

// ---------------------------------------------------------------- events
document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.profile) { profileKey = d.profile; if (tab === "admin") tab = "day"; render(); return window.scrollTo(0, 0); }
  if (t.id === "goto-reflect") {
    weekStart = mondayOf(today);
    if (!isWide()) setTab("week"); else render();
    const el = document.getElementById("reflect");
    if (el) window.scrollTo(0, el.getBoundingClientRect().top + scrollY - 80);
    return;
  }
  if (t.id === "profile-back") { profileKey = null; render(); return window.scrollTo(0, 0); }
  if (d.tick) { const [key, r] = d.tick.split(":"); return editTick(selected, key, row => { row[r] = !row[r]; }); }
  if (d.edit) return openPanel(selected, d.edit);
  if (t.id === "panel-close" || t.id === "panel-done") return closePanel();
  if (d.removeShot) {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Delete?"; return; }
    return removeShot(editing.day, editing.key, d.removeShot);
  }
  if (d.addShot) { shotTarget = { day: selected, key: d.addShot }; const inp = document.getElementById("shotinput"); inp.value = ""; inp.click(); return; }
  if (d.viewShot) { const i = d.viewShot.indexOf("|"), path = d.viewShot.slice(i + 1); return openViewer(path.split("/")[0], d.viewShot.slice(0, i), path); }
  if (t.id === "viewer-close") return document.getElementById("viewer").close();
  if (t.id === "viewer-delete") {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Sure? Tap again"; return; }
    document.getElementById("viewer").close();
    return viewing && removeShot(viewing.day, viewing.key, viewing.path);
  }
  if (d.day) { selected = d.day; if (isWide()) { if (tab === "admin") tab = "day"; render(); } else setTab("day"); return; }
  if (d.approve) {
    const key = document.getElementById("pick-" + d.approve).value;
    if (!key) { flash = ""; error = "Choose a name first."; return render(); }
    return adminDo(sb.from("profiles").update({ status: "approved", member_key: key }).eq("user_id", d.approve), "Approved.");
  }
  if (d.reject) return adminDo(sb.from("profiles").update({ status: "rejected", member_key: null }).eq("user_id", d.reject), "Rejected.");
  if (d.revoke) return adminDo(sb.from("profiles").update({ status: "rejected", member_key: null }).eq("user_id", d.revoke), "Access removed.");
  if (d.reconsider) return adminDo(sb.from("profiles").update({ status: "pending" }).eq("user_id", d.reconsider), "");
  if (d.rename) {
    const name = document.getElementById("mname-" + d.rename).value.trim();
    if (!name) return;
    return adminDo(sb.from("members").update({ name }).eq("key", d.rename), "Saved.");
  }
  if (d.hide) {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "Sure? Tap again"; return; }
    await sb.from("profiles").update({ status: "rejected", member_key: null }).eq("member_key", d.hide);
    return adminDo(sb.from("members").update({ active: false }).eq("key", d.hide), "Member removed.");
  }
  switch (t.id) {
    case "signin": {
      const { error: er } = await sb.auth.signInWithOAuth({ provider: "discord", options: { redirectTo: location.origin + location.pathname } });
      if (er) { error = er.message; render(); }
      return;
    }
    case "signout": await sb.auth.signOut(); return;
    case "addmember": {
      const el = document.getElementById("newmember"), name = el.value.trim();
      if (!name) return;
      const sort = Math.max(0, ...members.map(m => m.sort)) + 1;
      return adminDo(sb.from("members").insert({ key: slug(name), name, sort }), `Added ${name}.`);
    }
    case "toggleadmin": return setTab(tab === "admin" ? "day" : "admin");
    case "prev": selected = prevTrading(selected); weekStart = mondayOf(selected); return render();
    case "next": selected = nextTrading(selected); weekStart = mondayOf(selected); return render();
    case "gotoday": selected = today; weekStart = mondayOf(today); return render();
    case "pw": weekStart = addDays(weekStart, -7); return render();
    case "nw": weekStart = addDays(weekStart, 7); return render();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "panel-notrade" && editing) { const on = e.target.checked; return editTick(editing.day, editing.key, row => { row.no_trade = on; }); }
  if (e.target.dataset && e.target.dataset.refl) return editReflection(e.target.dataset.week, myKey(), e.target.dataset.refl, e.target.value);
  if (e.target.id === "panel-excused" && editing) { const on = e.target.checked; return editTick(editing.day, editing.key, row => { row.excused = on; }); }
  if (e.target.id !== "panel-note" || !editing) return;
  const v = e.target.value;
  document.getElementById("panel-count").textContent = `${v.length}/140`;
  editTick(editing.day, editing.key, row => { row.note = v; }, true);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && editing && !document.getElementById("viewer").open) closePanel();
  if (e.key === "Enter" && e.target.id === "newmember") document.getElementById("addmember").click();
});
document.getElementById("scrim").addEventListener("click", closePanel);
wideQuery.addEventListener("change", () => render());
document.getElementById("shotinput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (file && shotTarget) uploadShot(shotTarget.day, shotTarget.key, file);
  shotTarget = null;
});
// Tapping the dark area around a screenshot closes it.
document.getElementById("viewer").addEventListener("click", e => { if (e.target.id === "viewer") e.target.close(); });

// Keep the time-left bar current, and roll over to the next trading day by itself.
setInterval(() => {
  const t = currentTradingDay();
  if (t !== today) { if (selected === today) selected = t; today = t; weekStart = mondayOf(selected); }
  if (screen === "app" && tab !== "admin") render();
}, 60000);
// While waiting for approval, check every 20 seconds so the page opens as soon as you're approved.
setInterval(() => { if (screen === "waiting" && session) loadAll(); }, 20000);

// ---------------------------------------------------------------- start
(async () => {
  if (!sb) { screen = "setup"; return render(); }
  sb.auth.onAuthStateChange((event, s) => {
    const was = session && session.user.id;
    session = s;
    if (!s) { screen = "signin"; profile = null; isAdmin = false; if (channel) { sb.removeChannel(channel); channel = null; } render(); }
    else if (s.user.id !== was) { screen = "loading"; render(); setTimeout(loadAll, 0); }
  });
  const { data } = await sb.auth.getSession();
  if (!data.session) { screen = "signin"; render(); }
})();
</script>
